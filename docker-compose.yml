version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-sec-suite-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - ai-sec-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-sec-suite-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - ai-sec-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-sec-suite-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    networks:
      - ai-sec-net
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: ai-sec-suite-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - ai-sec-net

  redis:
    image: redis:7-alpine
    container_name: ai-sec-suite-redis
    ports:
      - "6379:6379"
    networks:
      - ai-sec-net

  minio:
    image: minio/minio:latest
    container_name: ai-sec-suite-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio_data:/data
    networks:
      - ai-sec-net

networks:
  ai-sec-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
